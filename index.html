function renderDebt(container) {
  const data = loadData();
  const debts = data.debts || [];

  const sortedDebts = [...debts].sort((a, b) => b.rate - a.rate);
  const highestRate = sortedDebts.length > 0 ? sortedDebts[0].rate : 0;

  const totalDebt = debts.reduce((sum, d) => sum + d.total, 0);
  const totalPaid = debts.reduce((sum, d) => sum + d.paid, 0);
  const totalRemaining = totalDebt - totalPaid;
  const overallProgress = totalDebt > 0 ? (totalPaid / totalDebt * 100) : 0;

  const halfCash = (data.extraCash || 0) / 2;

  container.innerHTML = `
    <div class="debt-summary-card">
      <div class="section-title-row">
        <div class="section-title">📊 总债务概览</div>
      </div>
      <div class="debt-summary-grid">
        <div class="debt-summary-item">
          <div class="ds-label">总负债</div>
          <div class="ds-value" style="color:var(--debt-red)">${formatMoney(totalDebt)}</div>
        </div>
        <div class="debt-summary-item">
          <div class="ds-label">已还总额</div>
          <div class="ds-value" style="color:var(--phase1)">${formatMoney(totalPaid)}</div>
        </div>
        <div class="debt-summary-item">
          <div class="ds-label">剩余总额</div>
          <div class="ds-value">${formatMoney(totalRemaining)}</div>
        </div>
      </div>
      <div class="progress-bar" style="height:10px;">
        <div class="progress-fill" style="width:${overallProgress}%;background:linear-gradient(90deg,var(--phase1),var(--gold))"></div>
      </div>
      <div class="text-center text-muted mt-8" style="font-size:12px;">总还款进度 ${formatPercent(overallProgress)}</div>
    </div>

    <div class="principle-5050-card">
      <div class="principle-5050-title">⚖️ 50/50 原则</div>
      <p class="text-muted" style="font-size:12px;">每月闲钱，一半还债、一半储蓄，两手都要抓</p>
      <div class="modal-field" style="margin-top:10px;margin-bottom:0">
        <div class="flex-between">
          <label style="margin:0;font-size:13px;">每月闲钱</label>
          <span class="text-muted" style="font-size:12px;">${formatMoney(data.extraCash || 0)}</span>
        </div>
        <input class="input mt-8" type="number" id="extra-cash-input" value="${data.extraCash || ''}" placeholder="设置每月闲钱" oninput="updateExtraCash(this.value)">
      </div>
      <div class="principle-5050-split">
        <div class="principle-5050-half half-debt">
          <div class="half-label">💳 还债 (50%)</div>
          <div class="half-value">${formatMoney(halfCash)}</div>
        </div>
        <div class="principle-5050-half half-save">
          <div class="half-label">🏦 储蓄 (50%)</div>
          <div class="half-value">${formatMoney(halfCash)}</div>
        </div>
      </div>
    </div>

    <button class="btn btn-primary btn-block mb-12" onclick="openAddDebtModal()">➕ 添加债务</button>

    ${sortedDebts.length === 0
      ? `<div class="empty-state">
          <div class="empty-icon">💳</div>
          <div class="empty-text">暂无债务记录<br>保持无债一身轻！</div>
        </div>`
      : sortedDebts.map(d => {
          const remaining = d.total - d.paid;
          const progress = d.total > 0 ? (d.paid / d.total * 100) : 0;
          const monthsLeft = d.monthlyPayment > 0 ? Math.ceil(remaining / d.monthlyPayment) : 0;
          const payoffDate = monthsLeft > 0 ? getPayoffDateStr(monthsLeft) : '—';
          const isHighest = d.rate === highestRate && debts.length > 1;

          return `
            <div class="debt-item-card ${isHighest ? 'highlight-debt' : ''}">
              <div class="debt-item-header">
                <div class="debt-item-name">${escapeHtml(d.name)} ${isHighest ? '<span class="badge badge-red" style="margin-left:4px">优先还清</span>' : ''}</div>
                <div class="debt-item-rate-badge">月利率 ${formatPercent(d.rate)}</div>
              </div>
              <div class="debt-item-details">
                <span class="detail-label">总额</span>
                <span class="detail-value">${formatMoney(d.total)}</span>
                <span class="detail-label">已还</span>
                <span class="detail-value" style="color:var(--phase1)">${formatMoney(d.paid)}</span>
                <span class="detail-label">剩余</span>
                <span class="detail-value" style="color:var(--debt-red)">${formatMoney(remaining)}</span>
                <span class="detail-label">月还款</span>
                <span class="detail-value">${formatMoney(d.monthlyPayment)}</span>

              ${monthsLeft > 0
                ? `<div class="debt-countdown">
                    📅 预计 <span class="countdown-date">${payoffDate}</span> 还清（还需 ${monthsLeft} 个月）

                  : ''

function getPayoffDateStr(monthsLeft) {
  const d = new Date();
  d.setMonth(d.getMonth() + monthsLeft);
  return `${d.getFullYear()}年${d.getMonth() + 1}月`;
}

function updateExtraCash(val) {
  const data = loadData();
  data.extraCash = parseFloat(val) || 0;
  saveData(data);
  const halfCash = data.extraCash / 2;
  const halves = document.querySelectorAll('.principle-5050-half .half-value');
  if (halves.length >= 2) {
    halves[0].textContent = formatMoney(halfCash);
    halves[1].textContent = formatMoney(halfCash);

  const cashLabel = document.querySelector('#extra-cash-input').parentElement.querySelector('.text-muted');
  if (cashLabel) cashLabel.textContent = formatMoney(data.extraCash);

function addDebt() {
  const name = document.getElementById('debt-name').value.trim();
  const total = parseFloat(document.getElementById('debt-total').value);
  const rate = parseFloat(document.getElementById('debt-rate').value);
  const monthly = parseFloat(document.getElementById('debt-monthly').value);

  if (!name) { showToast('请输入债务名称', '⚠️'); return; }
  if (!total || total <= 0) { showToast('请输入有效总额', '⚠️'); return; }
  if (isNaN(rate) || rate < 0) { showToast('请输入有效利率', '⚠️'); return; }
  if (!monthly || monthly <= 0) { showToast('请输入有效月还款额', '⚠️'); return; }

  const data = loadData();
  data.debts.push({
    id: generateId(),
    name,
    total,
    rate,
    monthlyPayment: monthly,
    paid: 0,
  });
  saveData(data);
  closeModal();
  showToast('债务已添加', '✅');
  renderDebt(document.getElementById('sub-page-container'));
}

function openRepayModal(debtId) {
  const data = loadData();
  const debt = data.debts.find(d => d.id === debtId);
  if (!debt) return;
  const remaining = debt.total - debt.paid;

  showModal(`
    <div class="modal-handle"></div>
    <div class="card-header"><span class="icon">💰</span> 还款 - ${escapeHtml(debt.name)}</div>
    <div class="modal-field">
      <label>还款金额</label>
      <input class="input" type="number" id="repay-amount" placeholder="如 2000" autofocus>
      <p class="text-muted mt-8" style="font-size:12px;">剩余：${formatMoney(remaining)}</p>
    </div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" onclick="repayDebt('${debtId}')">确认还款</button>
    </div>
  `);
}

function repayDebt(debtId) {
  const amount = parseFloat(document.getElementById('repay-amount').value);
  if (!amount || amount <= 0) {
    showToast('请输入有效金额', '⚠️');
    return;
  }

  const data = loadData();
  const debt = data.debts.find(d => d.id === debtId);
  if (!debt) return;

  const remaining = debt.total - debt.paid;
  if (amount > remaining) {
    showToast('还款金额超过剩余债务', '⚠️');
    return;
  }

  debt.paid += amount;
  saveData(data);
  closeModal();

  if (debt.paid >= debt.total) {
    showToast('🎉 债务已还清！', '✅');
    confetti({ count: 40, type: 'confetti', duration: 3000 });
  } else {
    showToast(`已还款 ${formatMoney(amount)}`, '💰');
  }

  renderDebt(document.getElementById('sub-page-container'));
}

function deleteDebt(debtId) {
  if (!confirmDialog('确定删除这条债务记录？')) return;
  const data = loadData();
  data.debts = data.debts.filter(d => d.id !== debtId);
  saveData(data);
  showToast('债务已删除', '🗑️');
  renderDebt(document.getElementById('sub-page-container'));
}

function toggleCalcCard(id) {
  document.getElementById(id).classList.toggle('expanded');
}

function calcPhases() {
  const monthly = parseFloat(document.getElementById('calc-phases-monthly').value);
  const table = document.getElementById('calc-phases-table');
  if (!monthly || monthly <= 0) {
    table.style.display = 'none';
    return;
  }
  table.style.display = '';
  document.getElementById('cp-phase1').textContent = formatMoney(monthly * 6);
  document.getElementById('cp-phase2').textContent = formatMoney(monthly * 150);

  const data = loadData();
  const ideal = data.freedom.idealMonthly || monthly;
  document.getElementById('cp-phase3').textContent = formatMoney(ideal * 150);
}

function calcCompound() {
  const P = parseFloat(document.getElementById('calc-cp-principal').value) || 0;
  const PMT = parseFloat(document.getElementById('calc-cp-monthly').value) || 0;
  const annualRate = parseFloat(document.getElementById('calc-cp-rate').value) || 0;
  const years = parseFloat(document.getElementById('calc-cp-years').value) || 0;

  const output = document.getElementById('calc-compound-output');
  if (annualRate <= 0 || years <= 0) {
    output.style.display = 'none';
    return;
  }

  const r = annualRate / 100 / 12;
  const n = years * 12;

  let finalValue;
  if (r === 0) {
    finalValue = P + PMT * n;
  } else {
    finalValue = P * Math.pow(1 + r, n) + PMT * (Math.pow(1 + r, n) - 1) / r;
  }

  const totalInvested = P + PMT * n;
  const totalProfit = finalValue - totalInvested;

  output.style.display = 'block';
  document.getElementById('cp-final').textContent = formatMoney(finalValue);
  document.getElementById('cp-invested').textContent = formatMoney(totalInvested);
  document.getElementById('cp-profit').textContent = formatMoney(totalProfit);
}

function calcRule72() {
  const rate = parseFloat(document.getElementById('calc-72-rate').value);
  const output = document.getElementById('calc-72-output');
  if (!rate || rate <= 0) {
    output.style.display = 'none';
    return;
  }
  const years = 72 / rate;
  output.style.display = 'block';
  document.getElementById('r72-rate').textContent = rate;
  document.getElementById('r72-years').textContent = years.toFixed(1) + ' 年';
  document.getElementById('r72-rate2').textContent = rate;
  document.getElementById('r72-years2').textContent = years.toFixed(1);
}

function calcGrowthTable() {
  const P = parseFloat(document.getElementById('calc-gt-principal').value) || 0;
  const PMT = parseFloat(document.getElementById('calc-gt-monthly').value) || 0;
  const annualRate = parseFloat(document.getElementById('calc-gt-rate').value) || 0;
  const years = parseFloat(document.getElementById('calc-gt-years').value) || 0;

  const output = document.getElementById('calc-growth-output');
  if (annualRate <= 0 || years <= 0) {
    output.style.display = 'none';
    return;
  }

  output.style.display = 'block';
  const r = annualRate / 100 / 12;
  const tbody = document.getElementById('gt-body');
  tbody.innerHTML = '';

  let cumulativeInvested = 0;
  let currentValue = 0;

  for (let y = 1; y <= years; y++) {
    const totalMonths = y * 12;
    if (r === 0) {
      currentValue = P + PMT * totalMonths;
    } else {
      currentValue = P * Math.pow(1 + r, totalMonths) + PMT * (Math.pow(1 + r, totalMonths) - 1) / r;
    }
    cumulativeInvested = P + PMT * totalMonths;
    const profit = currentValue - cumulativeInvested;

    const row = document.createElement('tr');
    row.innerHTML = `
      <td>第 ${y} 年</td>
      <td class="value-cell">${formatMoney(currentValue)}</td>
      <td class="value-cell">${formatMoney(cumulativeInvested)}</td>
      <td class="value-cell" style="color:var(--phase1)">${formatMoney(profit)}</td>
    `;
    tbody.appendChild(row);
  }
}

      advice: '提升专业技能，提高单位时间价值。学习新技能、考取证书、积累行业经验。',
      unlock: null,
      color: 'var(--level1)',
    },
    {
      level: 2,
      medal: '🥈',
      title: '批量出售时间',
      subtitle: '副业 · 作品 · 课程',
      desc: '一次劳动多次收益。打造可复制的产品或内容，让同一份劳动持续产生回报。',
      tags: ['🔄 一次劳动多次收益', '📦 可复制产品', '🌐 杠杆效应'],
      advice: '打造可复制的产品/内容/体系。写书、录课、做自媒体、开发工具。',
      unlock: '积累专业技能和经验',
      color: 'var(--level2)',
    },
    {
      level: 3,
      medal: '🥇',
      title: '用钱/资产赚钱',
      subtitle: '投资 · 股权 · 资产',
      desc: '财富放大最快的方式。让钱为你工作，通过投资和资产配置实现复利增长。',
      tags: ['💰 钱生钱', '📈 复利效应', '🏢 资产配置'],
      advice: '建立投资习惯，学习资产配置。股票、基金、房产、股权投资。',
      unlock: '有一定本金积累',
      color: 'var(--level3)',
    },
  ];

  const current = levels.find(l => l.level === currentLevel) || levels[0];

  const stepsVisual = levels.map(l => `
    <div class="level-step-visual step-${l.level} ${l.level === currentLevel ? 'step-current' : ''}" onclick="setIncomeLevel(${l.level})">
      ${l.medal} L${l.level}
    </div>
  `).join('');

  container.innerHTML = `
    <div class="level-steps-visual">
      ${stepsVisual}
    </div>

    <div class="income-current-display">
      <div class="income-current-icon">${current.medal}</div>
      <div class="income-current-name">Level ${current.level} - ${current.title}</div>
      <div class="income-current-desc">${current.subtitle}</div>
    </div>

    ${levels.map(l => `
      <div class="level-card ${l.level === currentLevel ? 'level-current' : ''}"
           style="--level-color: ${l.color}"
           onclick="setIncomeLevel(${l.level})">
        <div class="level-card-header">
          <span class="level-medal">${l.medal}</span>
          <div class="level-title-area">
            <div class="level-title" style="color:${l.color}">Level ${l.level} · ${l.title}</div>
            <div class="level-subtitle">${l.subtitle}</div>
          </div>
          ${l.level === currentLevel ? '<span class="level-current-badge">当前</span>' : ''}
        </div>
        <div class="level-desc">${l.desc}</div>
        <div class="level-tags">
          ${l.tags.map(t => `<span class="level-tag">${t}</span>`).join('')}
        </div>
        <div class="level-advice" style="border-left-color:${l.color}">
          💡 ${l.advice}
        </div>
        ${l.unlock && l.level !== currentLevel ? `<div class="level-unlock-hint">🔓 解锁条件：${l.unlock}</div>` : ''}
      </div>
    `).join('')}
  `;
}

function setIncomeLevel(level) {
  const data = loadData();
  if (data.incomeLevel === level) return;
  data.incomeLevel = level;
  saveData(data);
  const labels = { 1: 'Level 1 - 出售单份时间', 2: 'Level 2 - 批量出售时间', 3: 'Level 3 - 用钱赚钱' };
  showToast(`已切换到 ${labels[level]}`, '📈');
  renderIncomePath(document.getElementById('sub-page-container'));
}

// ============================================
// 模块3：四大支柱（详细页面，使用 pillar-detail-* 类名）
// ============================================

function renderPillars(container) {
  const data = loadData();
  const p = data.pillars || { dream: 0, goal: 0, values: 0, strategy: 0 };
  const avg = (p.dream + p.goal + p.values + p.strategy) / 4;
  const avgPercent = avg / 5 * 100;

  const pillars = [
    {
      key: 'dream',
      icon: '🌈',
      title: '梦想',
      subtitle: '明确想要的生活',
      question: '你清楚自己真正想要的生活是什么吗？',
      links: [{ label: '→ 梦想清单', page: 'dreams', sub: null }],
      hasReflection: false,
    },
    {
      key: 'goal',
      icon: '🎯',
      title: '目标',
      subtitle: '量化为数字+时间+画面',
      question: '你的财务目标是否具体到数字和时间？',
      links: [{ label: '→ 72小时法则', page: 'tasks', sub: null }],
      hasReflection: false,
      extra: '⏰ 72小时行动提醒：决定后72小时内迈出第一步，否则永远只是空想',
    },
    {
      key: 'values',
      icon: '💎',
      title: '价值观',
      subtitle: '让价值观与财富目标一致',
      question: '你认为金钱对你意味着什么？自由、安全、还是能力？',
      links: [],
      hasReflection: true,
      reflectionKey: 'values_reflection',
    },
    {
      key: 'strategy',
      icon: '🗺️',
      title: '策略',
      subtitle: '增收+储蓄+投资+还债',
      question: '你是否有清晰的财务策略？',
      links: [
        { label: '→ 金鹅账户', page: 'goose', sub: null },
        { label: '→ 自由之路', page: 'freedom', sub: null },
        { label: '→ 债务管理', page: 'more', sub: 'debt' },
        { label: '→ 收入升级', page: 'more', sub: 'income-path' },
      ],
      hasReflection: false,
    },
  ];

  container.innerHTML = `
    <div class="pillars-overview">
      <div class="pillars-overview-score">${avg.toFixed(1)}</div>
      <div class="pillars-overview-label">四大支柱平均分 / 5.0</div>
      <div class="pillars-overview-bar">
        <div class="pillars-overview-fill" style="width:${avgPercent}%"></div>
      </div>
    </div>

    ${pillars.map(pillar => {
      const score = p[pillar.key] || 0;
      const stars = Array.from({ length: 5 }, (_, i) =>
        `<span class="pillar-star ${i < score ? 'filled' : ''}">⭐</span>`
      ).join('');

      return `
        <div class="pillar-detail-card">
          <div class="pillar-header">
            <span class="pillar-detail-icon">${pillar.icon}</span>
            <div class="pillar-detail-title-area">
              <div class="pillar-detail-title">${pillar.title}</div>
              <div class="pillar-detail-subtitle">${pillar.subtitle}</div>
            </div>
            <span class="pillar-score-badge">${score}/5</span>
          </div>

          <div class="pillar-slider-container">
            <div class="pillar-slider-label">
              <span>0</span>
              <span>${stars}</span>
              <span>5</span>
            </div>
            <input type="range" class="pillar-slider" min="0" max="5" step="1" value="${score}"
                   oninput="updatePillarScore('${pillar.key}', this.value, this)">
          </div>

          <div class="pillar-guide-question">
            ${pillar.question}
          </div>

          ${pillar.extra ? `<div class="pillar-guide-question" style="border-left-color:var(--acct-joy);margin-top:6px">${pillar.extra}</div>` : ''}

          ${pillar.hasReflection ? `
            <div class="pillar-reflection">
              <div class="pillar-reflection-toggle" onclick="toggleReflection(this)">
                ✍️ 展开反思区 <span>▼</span>
              </div>
              <div class="pillar-reflection-area">
                <textarea placeholder="写下你的思考..." onblur="saveReflection('${pillar.reflectionKey}', this.value)">${(data.pillars[pillar.reflectionKey] || '')}</textarea>
              </div>
            </div>
          ` : ''}

          ${pillar.links.length > 0 ? `
            <div class="pillar-link-row">
              ${pillar.links.map(l => `<button class="pillar-link-btn" onclick="navigate('${l.page}'${l.sub ? `, '${l.sub}'` : ''})">${l.label}</button>`).join('')}
            </div>
          ` : ''}
        </div>
      `;
    }).join('')}
  `;
}

function updatePillarScore(key, val, sliderEl) {
  const data = loadData();
  data.pillars[key] = parseInt(val);
  saveData(data);

  const score = parseInt(val);
  const card = sliderEl.closest('.pillar-detail-card');
  const starsContainer = card.querySelector('.pillar-slider-label span:nth-child(2)');
  if (starsContainer) {
    const stars = starsContainer.querySelectorAll('.pillar-star');
    stars.forEach((s, i) => {
      s.classList.toggle('filled', i < score);
    });
  }

  const badge = card.querySelector('.pillar-score-badge');
  if (badge) badge.textContent = `${score}/5`;

  const p = data.pillars;
  const avg = (p.dream + p.goal + p.values + p.strategy) / 4;
  const avgPercent = avg / 5 * 100;
  const overviewScore = document.querySelector('.pillars-overview-score');
  const overviewFill = document.querySelector('.pillars-overview-fill');
  if (overviewScore) overviewScore.textContent = avg.toFixed(1);
  if (overviewFill) overviewFill.style.width = avgPercent + '%';
}

function toggleReflection(toggleEl) {
  const area = toggleEl.nextElementSibling;
  area.classList.toggle('expanded');
  const arrow = toggleEl.querySelector('span');
  if (arrow) {
    arrow.textContent = area.classList.contains('expanded') ? '▲' : '▼';
  }
}

function saveReflection(key, val) {
  const data = loadData();
  data.pillars[key] = val;
  saveData(data);
  showToast('反思已保存', '✍️');
}

// ============================================
// 初始化
// ============================================

function init() {
  if (!localStorage.getItem(STORAGE_KEY)) {
    saveData(DEFAULT_DATA);
  }

  updateGreeting();
  renderPage();
  setInterval(updateGreeting, 60000);

  console.log('💰 钱钱日记已就绪');
  console.log('   当前页面:', currentPage);
  console.log('   数据状态:', loadData() ? 'OK' : 'ERROR');
}

document.addEventListener('DOMContentLoaded', init);

window.__QQRJ__ = {
  loadData,
  saveData,
  navigate,
  renderPage,
  showToast,
  confetti,
  formatMoney,
  getGreeting,
  DEFAULT_DATA,
  getCurrentPage: () => currentPage,
  getSubPage: () => subPage,
};
</script>
