<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="钱钱日记">
<meta name="theme-color" content="#F5B800">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=3">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png?v=3">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png?v=3">
<title>钱钱日记</title>
<style>
/* ============================================
   CSS 变量 & 全局样式
   ============================================ */
:root {
  /* 主色系 — 暖金 */
  --gold: #F5B800;
  --gold-light: #FFD84D;
  --gold-dark: #C99300;
  --gold-deeper: #8B6914;
  --cream: #FFF8DC;

  /* 背景与表面 */
  --warm-bg: #FFFEF9;
  --card-bg: rgba(255,255,255,0.92);
  --card-bg-hover: rgba(255,255,255,0.98);

  /* 文字 */
  --text: #3D2B1F;
  --text-secondary: #6B5840;
  --text-light: #A08B70;
  --text-inverse: #FFFFFF;

  /* 3级阴影系统 — 棕色系，沉稳高级 */
  --shadow-sm: 0 2px 8px rgba(61,43,31,0.06);
  --shadow-md: 0 8px 24px rgba(61,43,31,0.10);
  --shadow-lg: 0 16px 48px rgba(61,43,31,0.16);
  --shadow: var(--shadow-sm);

  /* 圆角 */
  --radius: 20px;
  --radius-sm: 12px;
  --radius-xs: 8px;

  /* 尺寸 */
  --nav-height: 68px;

  /* 语义色 — 仅用于状态区分 */
  --color-success: #4CAF50;
  --color-info: #2196F3;
  --color-warning: #FF9800;
  --color-danger: #E53935;

  /* 阶段色 — 同色系深浅 */
  --phase1: #66BB6A;
  --phase2: var(--gold-dark);
  --phase3: var(--gold-deeper);

  /* 5账户色 — 金色系深浅变化 */
  --acct-goose: #C99300;
  --acct-dream: #E8A317;
  --acct-edu: #F0B429;
  --acct-joy: #FFC857;
  --acct-daily: #FFD388;

  /* 兼容旧引用 */
  --sky: #87CEEB;
  --mint: #98FB98;
  --debt-red: #E53935;
  --level1: #FFB74D;
  --level2: #64B5F6;
  --level3: #81C784;
}

*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  height: 100%;
  overflow: hidden;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  background: linear-gradient(160deg, #FFF9E6 0%, #FFFEF9 40%, #FFF5E1 100%);
  background-attachment: fixed;
  color: var(--text);
  line-height: 1.6;
  letter-spacing: 0.01em;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  display: flex;
  flex-direction: column;
}

/* ============================================
   滚动条美化
   ============================================ */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(218,165,32,0.3); border-radius: 4px; }

/* ============================================
   应用容器
   ============================================ */
#app {
  display: flex;
  flex-direction: column;
  height: 100%;
  max-width: 480px;
  margin: 0 auto;
  width: 100%;
  position: relative;
}

/* ============================================
   顶部问候区域
   ============================================ */
#header {
  padding: calc(16px + env(safe-area-inset-top, 0px)) 20px 8px;
  flex-shrink: 0;
  z-index: 10;
  background: linear-gradient(160deg, #FFF9E6 0%, #FFFEF9 100%);
}

.greeting-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.greeting-text {
  font-size: 26px;
  font-weight: 800;
  color: var(--text);
  letter-spacing: -0.01em;
}

.greeting-emoji {
  font-size: 32px;
  animation: wave 2s ease-in-out infinite;
}

.greeting-sub {
  font-size: 13px;
  color: var(--text-light);
  margin-top: 3px;
  font-weight: 500;
}

.greeting-date {
  font-size: 12px;
  color: var(--text-secondary);
  margin-top: 1px;
  font-weight: 500;
  opacity: 0.7;
}

@keyframes wave {
  0%, 100% { transform: rotate(0deg); }
  25% { transform: rotate(15deg); }
  75% { transform: rotate(-10deg); }
}

/* ============================================
   主内容容器
   ============================================ */
#main-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 4px 16px 8px;
  padding-bottom: var(--nav-height);
  -webkit-overflow-scrolling: touch;
  scroll-behavior: smooth;
}

/* 页面切换动画 */
.page {
  display: none;
  animation: fadeSlideIn 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

.page.active {
  display: block;
}

@keyframes fadeSlideIn {
  from {
    opacity: 0;
    transform: translateY(12px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* ============================================
   卡片样式
   ============================================ */
.card {
  background: var(--card-bg);
  border-radius: var(--radius);
  padding: 18px;
  margin-bottom: 10px;
  box-shadow: var(--shadow-sm);
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(201,147,0,0.06);
}

.card:active {
  transform: scale(0.985);
  box-shadow: var(--shadow-md);
}

.card-header {
  font-size: 15px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.card-header .icon {
  font-size: 18px;
}

/* ============================================
   按钮样式
   ============================================ */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 11px 22px;
  border: none;
  border-radius: var(--radius-sm);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  font-family: inherit;
  outline: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  letter-spacing: 0.02em;
}

.btn:active {
  transform: scale(0.96);
}

.btn-primary {
  background: linear-gradient(135deg, var(--gold-light), var(--gold));
  color: #fff;
  box-shadow: 0 4px 14px rgba(201,147,0,0.28);
}

.btn-primary:hover {
  box-shadow: 0 6px 20px rgba(201,147,0,0.36);
  transform: translateY(-1px);
}

.btn-outline {
  background: transparent;
  color: var(--gold-dark);
  border: 2px solid var(--gold);
}

.btn-outline:hover {
  background: rgba(255,215,0,0.1);
}

.btn-sm {
  padding: 6px 14px;
  font-size: 12px;
}

.btn-block {
  width: 100%;
}

.btn-danger {
  background: var(--debt-red);
  color: #fff;
}

.btn-icon {
  width: 40px;
  height: 40px;
  padding: 0;
  border-radius: 50%;
  font-size: 20px;
}

/* ============================================
   输入框样式
   ============================================ */
.input {
  width: 100%;
  padding: 12px 16px;
  border: 2px solid rgba(201,147,0,0.12);
  border-radius: var(--radius-sm);
  font-size: 15px;
  font-family: inherit;
  color: var(--text);
  background: rgba(255,255,255,0.7);
  transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  outline: none;
}

.input:focus {
  border-color: var(--gold);
  box-shadow: 0 0 0 4px rgba(245,184,0,0.12);
  background: #fff;
}

.input-group {
  display: flex;
  gap: 8px;
}

.input-group .input {
  flex: 1;
}

/* ============================================
   标签/徽章
   ============================================ */
.badge {
  display: inline-flex;
  align-items: center;
  padding: 3px 10px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 600;
}

.badge-gold {
  background: rgba(255,215,0,0.2);
  color: var(--gold-dark);
}

.badge-green {
  background: rgba(76,175,80,0.15);
  color: var(--phase1);
}

.badge-blue {
  background: rgba(33,150,243,0.15);
  color: var(--phase2);
}

.badge-purple {
  background: rgba(156,39,176,0.15);
  color: var(--phase3);
}

.badge-red {
  background: rgba(239,83,80,0.15);
  color: var(--debt-red);
}

/* ============================================
   进度条
   ============================================ */
.progress-bar {
  width: 100%;
  height: 8px;
  background: rgba(201,147,0,0.08);
  border-radius: 4px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  border-radius: 4px;
  transition: width 0.8s cubic-bezier(0.32, 0.72, 0, 1);
  background: linear-gradient(90deg, var(--gold-light), var(--gold));
}

/* ============================================
   底部导航栏
   ============================================ */
#bottom-nav {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 480px;
  height: var(--nav-height);
  background: rgba(255,255,255,0.92);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border-top: 1px solid rgba(201,147,0,0.08);
  display: flex;
  align-items: center;
  justify-content: space-around;
  padding: 0 8px;
  z-index: 100;
  box-shadow: 0 -4px 24px rgba(61,43,31,0.06);
}

.nav-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  padding: 8px 4px;
  border: none;
  background: none;
  cursor: pointer;
  font-family: inherit;
  font-size: 10px;
  color: var(--text-light);
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  position: relative;
  flex: 1;
  min-width: 0;
  outline: none;
  -webkit-tap-highlight-color: transparent;
}

.nav-item .nav-icon {
  font-size: 22px;
  transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

.nav-item .nav-label {
  font-weight: 500;
  line-height: 1;
}

.nav-item.active {
  color: var(--gold-dark);
}

.nav-item.active .nav-icon {
  transform: translateY(-2px) scale(1.15);
}

.nav-item.active::before {
  content: '';
  position: absolute;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 24px;
  height: 3px;
  background: linear-gradient(90deg, var(--gold-light), var(--gold));
  border-radius: 0 0 4px 4px;
}

.nav-item:active {
  transform: scale(0.9);
}

/* 更多按钮激活时无指示条 */
.nav-item.more-tab.active::before {
  display: none;
}

/* ============================================
   子页面导航（更多页面内）
   ============================================ */
.sub-nav {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 4px 0 12px;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}

.sub-nav::-webkit-scrollbar { display: none; }

.sub-nav-item {
  flex-shrink: 0;
  padding: 8px 16px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 500;
  color: var(--text-light);
  background: rgba(255,255,255,0.6);
  border: 1.5px solid transparent;
  cursor: pointer;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  white-space: nowrap;
  outline: none;
  -webkit-tap-highlight-color: transparent;
}

.sub-nav-item.active {
  color: var(--gold-dark);
  background: rgba(255,215,0,0.12);
  border-color: var(--gold);
  font-weight: 600;
}

/* ============================================
   Toast 提示
   ============================================ */
#toast-container {
  position: fixed;
  top: 60px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 9999;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  pointer-events: none;
}

.toast {
  background: rgba(61,43,31,0.95);
  color: #fff;
  padding: 12px 22px;
  border-radius: 28px;
  font-size: 14px;
  font-weight: 500;
  display: flex;
  align-items: center;
  gap: 8px;
  box-shadow: var(--shadow-lg);
  animation: toastIn 0.4s cubic-bezier(0.32, 0.72, 0, 1),
             toastOut 0.3s cubic-bezier(0.4, 0, 0.2, 1) 2.4s forwards;
  pointer-events: auto;
  max-width: 340px;
  text-align: center;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}

@keyframes toastIn {
  from {
    opacity: 0;
    transform: translateY(-20px) scale(0.9);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

@keyframes toastOut {
  from {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
  to {
    opacity: 0;
    transform: translateY(-10px) scale(0.9);
  }
}

/* ============================================
   撒花/金币动画
   ============================================ */
#confetti-container {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 9998;
}

.confetti-piece {
  position: absolute;
  width: 10px;
  height: 10px;
  border-radius: 2px;
  animation: confettiFall var(--fall-duration, 2s) cubic-bezier(0.4, 0, 0.2, 1) forwards,
             confettiShake var(--shake-duration, 0.8s) ease-in-out infinite;
}

@keyframes confettiFall {
  0% {
    transform: translateY(-100px) rotate(0deg);
    opacity: 1;
  }
  100% {
    transform: translateY(calc(100vh + 100px)) rotate(720deg);
    opacity: 0;
  }
}

@keyframes confettiShake {
  0%, 100% { transform: translateX(0); }
  50% { transform: translateX(20px); }
}

/* 金币动画 */
.coin {
  position: absolute;
  font-size: 28px;
  animation: coinDrop 2.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
  pointer-events: none;
}

@keyframes coinDrop {
  0% {
    transform: translateY(-80px) rotate(0deg) scale(0.5);
    opacity: 1;
  }
  60% {
    transform: translateY(60vh) rotate(360deg) scale(1.2);
    opacity: 1;
  }
  100% {
    transform: translateY(100vh) rotate(540deg) scale(0.8);
    opacity: 0;
  }
}

/* ============================================
   模态弹窗
   ============================================ */
.modal-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(61,43,31,0.4);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  z-index: 200;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  animation: fadeIn 0.2s ease;
}

.modal-sheet {
  background: #fff;
  border-radius: 24px 24px 0 0;
  width: 100%;
  max-width: 480px;
  max-height: 85vh;
  overflow-y: auto;
  padding: 8px 24px 32px;
  animation: slideUp 0.35s cubic-bezier(0.32, 0.72, 0, 1);
  box-shadow: var(--shadow-lg);
  position: relative;
}

.modal-sheet .modal-handle {
  width: 36px;
  height: 4px;
  background: rgba(0,0,0,0.15);
  border-radius: 2px;
  margin: 0 auto 16px;
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

@keyframes slideUp {
  from { transform: translateY(100%); }
  to { transform: translateY(0); }
}

/* ============================================
   空状态
   ============================================ */
.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 48px 20px;
  text-align: center;
}

.empty-state .empty-icon {
  font-size: 56px;
  margin-bottom: 16px;
  opacity: 0.5;
  animation: emptyFloat 3s ease-in-out infinite;
}

@keyframes emptyFloat {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-6px); }
}

.empty-state .empty-text {
  font-size: 15px;
  color: var(--text-light);
  font-weight: 500;
}

.empty-state .empty-sub {
  font-size: 13px;
  color: var(--text-light);
  opacity: 0.7;
  margin-top: 6px;
  line-height: 1.5;
}

/* ============================================
   响应式
   ============================================ */
@media (min-width: 481px) {
  #app {
    border-left: 1px solid rgba(218,165,32,0.08);
    border-right: 1px solid rgba(218,165,32,0.08);
  }
}

@media (max-width: 360px) {
  .nav-item {
    min-width: 44px;
    font-size: 9px;
  }
  .nav-item .nav-icon {
    font-size: 20px;
  }
  #header {
    padding: 12px 14px 6px;
  }
  .greeting-text {
    font-size: 20px;
  }
}

/* ============================================
   工具类
   ============================================ */
.text-center { text-align: center; }
.text-right { text-align: right; }
.text-gold { color: var(--gold-dark); }
.text-muted { color: var(--text-light); }
.mt-8 { margin-top: 8px; }
.mt-12 { margin-top: 12px; }
.mt-16 { margin-top: 16px; }
.mb-8 { margin-bottom: 8px; }
.mb-12 { margin-bottom: 12px; }
.mb-16 { margin-bottom: 16px; }
.flex { display: flex; }
.flex-between { display: flex; align-items: center; justify-content: space-between; }
.flex-center { display: flex; align-items: center; justify-content: center; }
.gap-8 { gap: 8px; }
.gap-12 { gap: 12px; }
.w-full { width: 100%; }

/* ============================================
   模块1：首页仪表盘 - 新增样式
   ============================================ */

/* 金鹅概览卡片 */
.goose-overview-card {
  background: linear-gradient(135deg, #FFF8DC 0%, #FFF3C4 100%);
  border-radius: var(--radius);
  padding: 20px 16px;
  margin-bottom: 12px;
  box-shadow: 0 6px 24px rgba(218,165,32,0.2);
  border: 2px solid rgba(255,215,0,0.3);
  cursor: pointer;
  position: relative;
  overflow: hidden;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

.goose-overview-card:active {
  transform: scale(0.97);
}

.goose-overview-card .goose-emoji {
  position: absolute;
  top: 12px;
  right: 16px;
  font-size: 48px;
  animation: gooseFloat 3s ease-in-out infinite;
}

@keyframes gooseFloat {
  0%, 100% { transform: translateY(0) rotate(-3deg); }
  50% { transform: translateY(-8px) rotate(3deg); }
}

.goose-overview-card .goose-balance {
  font-size: 28px;
  font-weight: 800;
  color: var(--text);
  margin-bottom: 2px;
}

.goose-overview-card .goose-label {
  font-size: 12px;
  color: var(--text-light);
  margin-bottom: 6px;
}

.goose-overview-card .goose-monthly {
  font-size: 14px;
  font-weight: 600;
  color: var(--gold-dark);
  background: rgba(255,215,0,0.15);
  display: inline-block;
  padding: 4px 12px;
  border-radius: 12px;
}

/* 四格统计卡片 */
.stats-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 12px;
}

.stat-card {
  background: var(--card-bg);
  border-radius: var(--radius);
  padding: 14px 12px;
  box-shadow: var(--shadow);
  border: 1px solid rgba(218,165,32,0.08);
  text-align: center;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

.stat-card .stat-icon {
  font-size: 24px;
  margin-bottom: 4px;
}

.stat-card .stat-value {
  font-size: 20px;
  font-weight: 700;
  color: var(--text);
  line-height: 1.3;
}

.stat-card .stat-label {
  font-size: 11px;
  color: var(--text-light);
  margin-top: 2px;
}

/* 今日待办进度条 */
.task-progress-card {
  background: var(--card-bg);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 12px;
  box-shadow: var(--shadow);
  border: 1px solid rgba(218,165,32,0.08);
}

.task-progress-card .task-progress-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
}

.task-progress-card .task-progress-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
  display: flex;
  align-items: center;
  gap: 6px;
}

.task-progress-card .task-progress-count {
  font-size: 13px;
  color: var(--text-light);
  font-weight: 500;
}

.task-progress-card .progress-bar {
  height: 10px;
  border-radius: 5px;
}

.task-progress-card .progress-fill {
  border-radius: 5px;
  background: linear-gradient(90deg, #81C784, #4CAF50);
}

/* 理财语录轮播 */

.goose-display .goose-emoji {
  font-size: 56px;
  animation: gooseFloat 3s ease-in-out infinite;
  line-height: 1;
  position: relative;
  z-index: 1;
}

.goose-crown {
  position: absolute;
  font-size: 28px;
  transform: translate(18px, -52px);
}

.goose-level-tag {
  margin-top: 8px;
  font-size: 13px;
  font-weight: 600;
  color: var(--gold-dark);
  background: rgba(255,215,0,0.15);
  padding: 4px 14px;
  border-radius: 20px;
}

.goose-display .goose-balance {
  margin-top: 4px;
  font-size: 20px;
  font-weight: 700;
  color: var(--gold-dark);
}

.account-cards {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-bottom: 12px;
}

.account-card {
  border-radius: var(--radius-sm);
  padding: 14px;
  color: #fff;
  box-shadow: 0 4px 15px rgba(0,0,0,0.1);
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

.account-card:active {
  transform: scale(0.98);
}

.acct-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 6px;
}

.acct-name {
  font-size: 15px;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 6px;
}

.acct-ratio {
  font-size: 12px;
  opacity: 0.9;
  background: rgba(255,255,255,0.25);
  padding: 2px 10px;
  border-radius: 10px;
}

.acct-desc {
  font-size: 11px;
  opacity: 0.8;
  margin-bottom: 8px;
}

.acct-amount-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 6px;
}

.acct-balance {
  font-size: 18px;
  font-weight: 700;
}

.acct-monthly {
  font-size: 11px;
  opacity: 0.85;
}

.acct-progress {
  width: 100%;
  height: 5px;
  background: rgba(255,255,255,0.25);
  border-radius: 3px;
  overflow: hidden;
}

.acct-progress-fill {
  height: 100%;
  border-radius: 3px;
  background: rgba(255,255,255,0.8);
  transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
}

/* 账户卡片颜色 */
.acct-goose { background: linear-gradient(135deg, #FFD700, #F0A500); }
.acct-dream { background: linear-gradient(135deg, #FF6B9D, #E91E63); }
.acct-edu { background: linear-gradient(135deg, #4FC3F7, #0288D1); }
.acct-joy { background: linear-gradient(135deg, #FFB74D, #F57C00); }
.acct-daily { background: linear-gradient(135deg, #81C784, #388E3C); }

/* 紧凑账户列表 — 白底+色条 */
.account-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 12px;
}

.account-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 16px;
  background: var(--card-bg);
  border-radius: var(--radius-sm);
  box-shadow: var(--shadow-sm);
  border: 1px solid rgba(201,147,0,0.06);
  position: relative;
  overflow: hidden;
  transition: all 0.25s ease;
}

.account-row:active {
  transform: scale(0.985);
}

.account-row .acct-color-bar {
  width: 4px;
  height: 32px;
  border-radius: 2px;
  flex-shrink: 0;
}

.account-row .acct-row-icon {
  font-size: 22px;
  flex-shrink: 0;
}

.account-row .acct-row-info {
  flex: 1;
  min-width: 0;
}

.account-row .acct-row-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 2px;
}

.account-row .acct-row-name {
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
}

.account-row .acct-row-ratio {
  font-size: 11px;
  font-weight: 600;
  color: var(--text-light);
  background: rgba(201,147,0,0.08);
  padding: 2px 8px;
  border-radius: 8px;
}

.account-row .acct-row-bottom {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.account-row .acct-row-balance {
  font-size: 16px;
  font-weight: 700;
  color: var(--text);
  font-variant-numeric: tabular-nums;
}

.account-row .acct-row-monthly {
  font-size: 11px;
  color: var(--text-light);
}

/* 可折叠详情卡片 */
.collapsible-card {
  background: var(--card-bg);
  border-radius: var(--radius);
  margin-bottom: 10px;
  box-shadow: var(--shadow-sm);
  border: 1px solid rgba(201,147,0,0.06);
  overflow: hidden;
}

.collapsible-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 18px;
  cursor: pointer;
  font-size: 15px;
  font-weight: 600;
  color: var(--text);
  outline: none;
  -webkit-tap-highlight-color: transparent;
}

.collapsible-header .ch-icon {
  display: flex;
  align-items: center;
  gap: 6px;
}

.collapsible-header .ch-arrow {
  font-size: 12px;
  color: var(--text-light);
  transition: transform 0.3s ease;
}

.collapsible-card.open .ch-arrow {
  transform: rotate(180deg);
}

.collapsible-body {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.4s cubic-bezier(0.32, 0.72, 0, 1);
}

.collapsible-card.open .collapsible-body {
  max-height: 1200px;
}

.collapsible-body-inner {
  padding: 0 18px 18px;
}

/* 操作栏 */
.action-bar {
  display: flex;
  gap: 8px;
  margin-bottom: 12px;
}

.action-bar .btn {
  flex: 1;
}

/* 收入录入按钮 */
.income-record-btn {
  margin-bottom: 12px;
}

/* 收入历史列表 */
.income-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.income-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  background: rgba(255,255,255,0.6);
  transition: background 0.2s;
}

.income-item:hover {
  background: rgba(255,215,0,0.06);
}

.income-item-left {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.income-amount {
  font-size: 15px;
  font-weight: 600;
  color: var(--text);
}

.income-source {
  font-size: 12px;
  color: var(--text-light);
}

.income-date {
  font-size: 11px;
  color: var(--text-light);
  opacity: 0.7;
}

.income-delete {
  width: 28px;
  height: 28px;
  border: none;
  background: transparent;
  color: #ccc;
  font-size: 16px;
  cursor: pointer;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
  outline: none;
  -webkit-tap-highlight-color: transparent;
}

.income-delete:hover {
  color: var(--debt-red);
  background: rgba(239,83,80,0.1);
}

/* 饼图 - 条形图展示 */
.pie-chart {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.pie-item {
  display: flex;
  align-items: center;
  gap: 8px;
}

.pie-color {
  width: 12px;
  height: 12px;
  border-radius: 3px;
  flex-shrink: 0;
}

.pie-label {
  font-size: 12px;
  color: var(--text);
  width: 50px;
  flex-shrink: 0;
}

.pie-bar-track {
  flex: 1;
  height: 8px;
  background: rgba(0,0,0,0.05);
  border-radius: 4px;
  overflow: hidden;
}

.pie-bar-fill {
  height: 100%;
  border-radius: 4px;
  transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
}

.pie-percent {
  font-size: 11px;
  color: var(--text-light);
  width: 36px;
  text-align: right;
  flex-shrink: 0;
}

/* 比例设置 */
.ratio-settings {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.ratio-row {
  display: flex;
  align-items: center;
  gap: 10px;
}

.ratio-label {
  font-size: 13px;
  font-weight: 500;
  color: var(--text);
  width: 70px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 4px;
}

.ratio-input {
  width: 60px;
  padding: 6px 10px;
  border: 2px solid rgba(218,165,32,0.2);
  border-radius: 8px;
  font-size: 14px;
  font-weight: 600;
  text-align: center;
  font-family: inherit;
  color: var(--text);
  background: rgba(255,255,255,0.6);
  transition: all 0.3s;
  outline: none;
}

.ratio-input:focus {
  border-color: var(--gold);
  box-shadow: 0 0 0 3px rgba(255,215,0,0.1);
}

.ratio-total {
  font-size: 14px;
  font-weight: 700;
  color: var(--text);
  text-align: center;
  padding: 8px;
  border-radius: 8px;
  background: rgba(255,255,255,0.6);
}

.ratio-total.valid {
  color: var(--phase1);
}

.ratio-total.invalid {
  color: var(--debt-red);
}

/* 收入分配预览 */
.allocation-preview {
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 12px;
  background: rgba(255,215,0,0.06);
  border-radius: var(--radius-sm);
  margin-bottom: 12px;
}

.allocation-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 13px;
}

.allocation-amount-input {
  width: 90px;
  padding: 4px 8px;
  border: 1px solid rgba(218,165,32,0.2);
  border-radius: 6px;
  font-size: 13px;
  text-align: right;
  font-family: inherit;
  color: var(--text);
  background: #fff;
  outline: none;
  transition: border-color 0.2s;
}

.allocation-amount-input:focus {
  border-color: var(--gold);
}

/* ============================================
   模块2：成功日记 - 附加样式
   ============================================ */
.diary-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
}

.streak-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 4px 12px;
  background: linear-gradient(135deg, #FF6B6B, #FF8E53);
  color: #fff;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 600;
}

.date-nav {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 12px;
}

.date-nav-btn {
  width: 32px;
  height: 32px;
  border: 1.5px solid rgba(218,165,32,0.2);
  border-radius: 50%;
  background: #fff;
  font-size: 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text);
  transition: all 0.2s;
  flex-shrink: 0;
  outline: none;
  -webkit-tap-highlight-color: transparent;
}

.date-nav-btn:disabled {
  opacity: 0.3;
  cursor: not-allowed;
}

.date-nav-btn:not(:disabled):hover {
  border-color: var(--gold);
  background: rgba(255,215,0,0.08);
}

.date-nav-display {
  flex: 1;
  text-align: center;
  font-size: 15px;
  font-weight: 600;
  color: var(--text);
}

.diary-entry-count {
  font-size: 12px;
  color: var(--text-light);
  margin-bottom: 8px;
}

.diary-entry {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  background: rgba(255,255,255,0.6);
  margin-bottom: 6px;
  transition: background 0.2s;
}

.diary-entry-number {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: var(--gold);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 600;
  flex-shrink: 0;
}

.diary-entry-text {
  flex: 1;
  font-size: 14px;
  color: var(--text);
  word-break: break-word;
}

.diary-entry-delete {
  width: 28px;
  height: 28px;
  border: none;
  background: transparent;
  color: #ccc;
  font-size: 16px;
  cursor: pointer;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: all 0.2s;
  outline: none;
  -webkit-tap-highlight-color: transparent;
}

.diary-entry-delete:hover {
  color: var(--debt-red);
  background: rgba(239,83,80,0.1);
}

.diary-add-row {
  display: flex;
  gap: 8px;
  align-items: center;
}

.diary-add-input {
  flex: 1;
}

.history-cards {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 4px 0;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}

.history-cards::-webkit-scrollbar { display: none; }

.history-card {
  flex-shrink: 0;
  width: 80px;
  padding: 12px 8px;
  border-radius: var(--radius-sm);
  background: rgba(255,255,255,0.7);
  text-align: center;
  cursor: pointer;
  border: 1.5px solid transparent;
  transition: all 0.25s;
  -webkit-tap-highlight-color: transparent;
}

.history-card:hover {
  border-color: rgba(218,165,32,0.3);
  transform: translateY(-2px);
}

.history-card.selected {
  border-color: var(--gold);
  background: rgba(255,215,0,0.08);
}

.history-card-date {
  font-size: 11px;
  color: var(--text-light);
  margin-bottom: 4px;
}

.history-card-count {
  font-size: 18px;
  font-weight: 700;
  color: var(--gold-dark);
}

/* 模态弹窗内表单 */
.modal-form-group {
  margin-bottom: 12px;
}

.modal-form-label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 4px;
}

.modal-actions {
  display: flex;
  gap: 8px;
  margin-top: 16px;
}

/* ============================================
   模态弹窗关闭按钮增强
   ============================================ */
.modal-close-btn {
  width: 32px;
  height: 32px;
  border: none;
  background: rgba(0,0,0,0.05);
  border-radius: 50%;
  font-size: 18px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  position: absolute;
  top: 16px;
  right: 16px;
  color: var(--text-light);
  transition: all 0.2s;
  outline: none;
}

.modal-close-btn:hover {
  background: rgba(0,0,0,0.1);
  color: var(--text);
}

.modal-title {
  font-size: 17px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 16px;
  text-align: center;
}

/* ============================================
   模块3：财务自由之路 - 阶梯式三阶段
   ============================================ */
.freedom-steps {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 16px;
}

.phase-card {
  position: relative;
  background: var(--card-bg);
  border-radius: var(--radius);
  padding: 18px 16px 16px;
  box-shadow: var(--shadow);
  border: 2px solid transparent;
  transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  backdrop-filter: blur(10px);
  overflow: hidden;
}

.phase-card.phase-active {
  border-color: var(--phase-color);
  box-shadow: 0 6px 24px rgba(218,165,32,0.18), 0 0 0 1px var(--phase-color);
}

.phase-card.phase-locked {
  opacity: 0.55;
  filter: grayscale(0.6);
  background: rgba(255,255,255,0.5);
}

.phase-card.phase-complete {
  border-color: var(--phase-color);
  opacity: 0.95;
}

.phase-step-bar {
  position: absolute;
  top: 0;
  left: 0;
  width: 5px;
  height: 100%;
  background: var(--phase-color);
  border-radius: 0 4px 4px 0;
}

.phase-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 12px;
  padding-left: 8px;
}

.phase-icon-lg {
  font-size: 32px;
  line-height: 1;
}

.phase-title-area {
  flex: 1;
}

.phase-title {
  font-size: 16px;
  font-weight: 700;
  color: var(--text);
  margin: 0;
}

.phase-subtitle {
  font-size: 12px;
  color: var(--text-light);
  margin-top: 2px;
}

.phase-status-badge {
  font-size: 11px;
  font-weight: 600;
  padding: 4px 10px;
  border-radius: 20px;
  white-space: nowrap;
}

.phase-body {
  padding-left: 8px;
}

.phase-info-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 13px;
  margin-bottom: 6px;
}

.phase-info-row .label {
  color: var(--text-light);
}

.phase-info-row .value {
  font-weight: 600;
  color: var(--text);
}

.phase-progress-section {
  margin: 10px 0;
}

.phase-progress-bar {
  width: 100%;
  height: 10px;
  background: rgba(218,165,32,0.08);
  border-radius: 5px;
  overflow: hidden;
}

.phase-progress-fill {
  height: 100%;
  border-radius: 5px;
  transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
  background: var(--phase-color);
}

.phase-actions {
  display: flex;
  gap: 8px;
  margin-top: 10px;
}

.phase-actions .btn {
  flex: 1;
  font-size: 12px;
  padding: 8px 12px;
}

.phase-hint {
  font-size: 12px;
  color: var(--text-light);
  margin-top: 8px;
  padding: 8px 10px;
  background: rgba(255,215,0,0.06);
  border-radius: 8px;
  border-left: 3px solid var(--gold);
}

.phase-locked-hint {
  text-align: center;
  font-size: 13px;
  color: var(--text-light);
  padding: 12px;
}

.golden-egg-card {
  background: linear-gradient(135deg, rgba(156,39,176,0.08), rgba(255,215,0,0.08));
  border-radius: 16px;
  padding: 14px 16px;
  margin-top: 10px;
  text-align: center;
  border: 1.5px dashed rgba(156,39,176,0.2);
}

.golden-egg-card .egg-title {
  font-size: 14px;
  font-weight: 700;
  color: var(--phase3);
}

.golden-egg-card .egg-sub {
  font-size: 12px;
  color: var(--text-light);
  margin-top: 4px;
}

/* ============================================
   模块3：债务管理
   ============================================ */
.debt-summary-card {
  background: linear-gradient(135deg, rgba(239,83,80,0.06), rgba(255,255,255,0.6));
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 12px;
  box-shadow: var(--shadow);
  border: 1px solid rgba(239,83,80,0.1);
}

.debt-summary-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin: 12px 0;
}

.debt-summary-item {
  text-align: center;
}

.debt-summary-item .ds-label {
  font-size: 11px;
  color: var(--text-light);
  margin-bottom: 4px;
}

.debt-summary-item .ds-value {
  font-size: 14px;
  font-weight: 700;
}

.debt-item-card {
  background: var(--card-bg);
  border-radius: var(--radius);
  padding: 14px 16px;
  margin-bottom: 10px;
  box-shadow: var(--shadow);
  border: 1px solid rgba(218,165,32,0.08);
  transition: all 0.3s;
}

.debt-item-card.highlight-debt {
  border: 2px solid var(--debt-red);
  box-shadow: 0 4px 16px rgba(239,83,80,0.15);
}

.debt-item-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
}

.debt-item-name {
  font-size: 15px;
  font-weight: 600;
  color: var(--text);
}

.debt-item-rate-badge {
  font-size: 11px;
  padding: 3px 8px;
  border-radius: 12px;
  background: rgba(239,83,80,0.12);
  color: var(--debt-red);
  font-weight: 600;
}

.debt-item-details {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 4px 12px;
  font-size: 12px;
  margin-bottom: 8px;
}

.debt-item-details .detail-label {
  color: var(--text-light);
}

.debt-item-details .detail-value {
  font-weight: 600;
  text-align: right;
}

.debt-progress-section {
  margin: 8px 0;
}

.debt-countdown {
  font-size: 12px;
  color: var(--text-light);
  margin-top: 6px;
  display: flex;
  align-items: center;
  gap: 4px;
}

.debt-countdown .countdown-date {
  font-weight: 600;
  color: var(--gold-dark);
}

.debt-item-actions {
  display: flex;
  gap: 8px;
  margin-top: 8px;
}

.debt-item-actions .btn {
  flex: 1;
  font-size: 12px;
  padding: 7px 10px;
}

.principle-5050-card {
  background: linear-gradient(135deg, rgba(255,215,0,0.08), rgba(76,175,80,0.08));

<script>
/* ============================================
   钱钱日记 - 完整应用
   ============================================ */

'use strict';

// ============================================
// 数据模型
// ============================================
const STORAGE_KEY = 'qqrj_data';

const DEFAULT_DATA = {
  dreams: [],
  tasks: [],
  incomes: [],
  diaries: {},
  streak: 0,
  lastDiaryDate: null,

  freedom: {
    monthlyEssential: 0,
    emergencyFund: 0,
    investmentPrincipal: 0,
    passiveIncome: 0,
    idealMonthly: 0,
    phase1Complete: false,
    phase2Complete: false,
  },

  accounts: {
    goose: { balance: 0, monthlyIn: 0, ratio: 50 },
    dream: { balance: 0, monthlyIn: 0, ratio: 20 },
    edu: { balance: 0, monthlyIn: 0, ratio: 10 },
    joy: { balance: 0, monthlyIn: 0, ratio: 10 },
    daily: { balance: 0, monthlyIn: 0, ratio: 10 },
  },

  debts: [],
  extraCash: 0,
  incomeLevel: 1,
  pillars: { dream: 0, goal: 0, values: 0, strategy: 0 },
};

// ============================================
// 数据操作
// ============================================

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return JSON.parse(JSON.stringify(DEFAULT_DATA));
    const data = JSON.parse(raw);
    return deepMerge(DEFAULT_DATA, data);
  } catch (e) {
    console.error('数据加载失败，使用默认数据:', e);
    return JSON.parse(JSON.stringify(DEFAULT_DATA));
  }
}

function saveData(data) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  } catch (e) {
    console.error('数据保存失败:', e);
    showToast('数据保存失败，请检查存储空间', '⚠️');
  }
}

function deepMerge(defaults, data) {
  const result = JSON.parse(JSON.stringify(defaults));
  for (const key in data) {
    if (data.hasOwnProperty(key)) {
      if (typeof data[key] === 'object' && data[key] !== null && !Array.isArray(data[key])) {
        result[key] = deepMerge(result[key] || {}, data[key]);
      } else {
        result[key] = data[key];
      }
    }
  }
  return result;
}

// ============================================
// 应用状态
// ============================================
let currentPage = 'home';
let subPage = 'diary';

// ============================================
// 路由系统
// ============================================

function navigate(page, sub) {
  if (page === 'more' && sub) {
    currentPage = 'more';
    subPage = sub;
  } else {
    currentPage = page;
    if (page !== 'more') {
      subPage = 'diary';
    }
  }

  const allPages = document.querySelectorAll('.page');
  allPages.forEach(p => p.classList.remove('active'));

  const targetPage = document.getElementById('page-' + page);
  if (targetPage) {
    targetPage.classList.add('active');
  }

  const navItems = document.querySelectorAll('#bottom-nav .nav-item');
  navItems.forEach(item => {
    item.classList.toggle('active', item.dataset.page === page);
  });

  if (page === 'more') {
    const subNavItems = document.querySelectorAll('#sub-nav .sub-nav-item');
    subNavItems.forEach(item => {
      item.classList.toggle('active', item.dataset.sub === subPage);
    });
  }

  renderPage();

  document.getElementById('main-content').scrollTop = 0;

  updateGreeting();
}

function renderPage() {
  const pageRenderers = {
    home: renderHome,
    dreams: renderDreams,
    tasks: renderTasks,
    goose: renderGoose,
    more: renderMoreSubPage,
  };

  const renderer = pageRenderers[currentPage];
  if (renderer) {
    renderer();
  }
}

function renderMoreSubPage() {
  const container = document.getElementById('sub-page-container');
  if (!container) return;
  container.innerHTML = '';

  const subRenderers = {
    diary: function(c) { renderDiaryInto(c); },
    freedom: function(c) { renderFreedomInto(c); },
    debt: renderDebt,
    calculator: renderCalculator,
    'income-path': renderIncomePath,
    pillars: renderPillars,
  };

  const renderer = subRenderers[subPage];
  if (renderer) {
    renderer(container);
  }
}

// ============================================
// 工具函数
// ============================================

function showToast(msg, icon) {
  const container = document.getElementById('toast-container');
  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.innerHTML = icon ? '<span>' + icon + '</span> ' + msg : msg;

  container.appendChild(toast);

  setTimeout(() => {
    if (toast.parentNode) {
      toast.remove();
    }
  }, 2900);
}

function confetti(options) {
  const opts = Object.assign({
    count: 50,
    type: 'confetti',
    duration: 3000,
  }, options || {});

  const container = document.getElementById('confetti-container');
  const colors = ['#FFD700', '#DAA520', '#FF6B9D', '#4FC3F7', '#81C784', '#FFB74D', '#9C27B0', '#FF5722'];

  for (let i = 0; i < opts.count; i++) {
    const piece = document.createElement('div');

    if (opts.type === 'coin') {
      piece.className = 'coin';
      piece.textContent = '🪙';
      piece.style.left = Math.random() * 100 + '%';
      piece.style.animationDelay = Math.random() * 0.5 + 's';
      piece.style.animationDuration = (1.5 + Math.random() * 1.5) + 's';
    } else {
      piece.className = 'confetti-piece';
      piece.style.left = Math.random() * 100 + '%';
      piece.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
      piece.style.width = (6 + Math.random() * 10) + 'px';
      piece.style.height = (6 + Math.random() * 10) + 'px';
      piece.style.setProperty('--fall-duration', (1.5 + Math.random() * 2) + 's');
      piece.style.setProperty('--shake-duration', (0.5 + Math.random() * 0.8) + 's');
      piece.style.animationDelay = Math.random() * 0.3 + 's';
    }

    container.appendChild(piece);
  }

  setTimeout(() => {
    container.innerHTML = '';
  }, opts.duration + 500);
}

function formatMoney(n) {
  return '¥' + Number(n).toLocaleString('zh-CN', {
    minimumFractionDigits: 2,
    maximumFractionDigits: 2,
  });
}

function formatPercent(n) {
  return Number(n).toFixed(1) + '%';
}

function getGreeting() {
  const hour = new Date().getHours();
  if (hour < 6) return { text: '夜深了 🌙', emoji: '🌙', sub: '早点休息，明天继续加油' };
  if (hour < 9) return { text: '早上好 ☀️', emoji: '☀️', sub: '新的一天，新的开始' };
  if (hour < 12) return { text: '上午好 🌤️', emoji: '🌤️', sub: '元气满满，高效工作' };
  if (hour < 14) return { text: '中午好 🌞', emoji: '🌞', sub: '记得好好吃饭哦' };
  if (hour < 17) return { text: '下午好 🌈', emoji: '🌈', sub: '坚持就是胜利' };
  if (hour < 19) return { text: '傍晚好 🌅', emoji: '🌅', sub: '一天辛苦了，放松一下吧' };
  return { text: '晚上好 🌙', emoji: '✨', sub: '回顾今天，计划明天' };

function updateGreeting() {
  const greeting = getGreeting();
  document.getElementById('greeting-text').textContent = greeting.text;
  document.getElementById('greeting-emoji').textContent = greeting.emoji;
  document.getElementById('greeting-sub').textContent = greeting.sub;
  // 日期显示
  var dateEl = document.getElementById('greeting-date');
  if (dateEl) {
    var d = new Date();
    var weekdays = ['日', '一', '二', '三', '四', '五', '六'];
    dateEl.textContent = (d.getMonth() + 1) + '月' + d.getDate() + '日 周' + weekdays[d.getDay()];
  }
}

function generateId() {
  return Date.now().toString(36) + Math.random().toString(36).substring(2, 9);
}

function getTodayStr() {
  return new Date().toISOString().split('T')[0];
}

function formatDate(dateStr) {
  const d = new Date(dateStr);
  const month = d.getMonth() + 1;
  const day = d.getDate();
  const weekdays = ['日', '一', '二', '三', '四', '五', '六'];
  const weekday = weekdays[d.getDay()];
  return month + '月' + day + '日 周' + weekday;
}

function confirmDialog(msg) {
  return window.confirm(msg);
}

/**
 * HTML 转义，防止 XSS
 */
function escapeHtml(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

}

function updateQuoteDisplay() {
  const textEl = document.getElementById('quote-text');
  const sourceEl = document.getElementById('quote-source');
  const dotsEl = document.getElementById('quote-dots');

  if (!textEl || !sourceEl) return;

  const quote = QUOTES[currentQuoteIndex];

  textEl.style.opacity = '0';
  sourceEl.style.opacity = '0';

  setTimeout(function() {
    textEl.textContent = quote.text;
    sourceEl.textContent = quote.source;

    sourceEl.style.opacity = '1';

  if (dotsEl) {
    const dots = dotsEl.querySelectorAll('.quote-dot');
    dots.forEach(function(dot, i) {
      dot.classList.toggle('active', i === currentQuoteIndex);

  }
}

function submitAddDream() {
  var nameEl = document.getElementById('dream-name-input');
  var targetEl = document.getElementById('dream-target-input');
  var dateEl = document.getElementById('dream-date-input');
  var emojiEl = document.getElementById('dream-emoji-input');

  var name = (nameEl ? nameEl.value.trim() : '');
  var target = parseFloat(targetEl ? targetEl.value : 0);
  var date = dateEl ? dateEl.value : '';
  var emoji = emojiEl ? emojiEl.value : '🌟';

  if (!name) {
    showToast('请输入梦想名称', '⚠️');
    return;
  }
  if (!target || target <= 0) {
    showToast('请输入有效的目标金额', '⚠️');
    return;
  }

  var data = loadData();
  if (data.dreams.length >= 3) {
    showToast('最多只能有3个梦想哦', '⚠️');
    return;
  }

  var newDream = {
    id: generateId(),
    name: name,
    target: target,
    saved: 0,
    date: date || null,
    emoji: emoji,
    createdAt: new Date().toISOString(),
  };

  data.dreams.push(newDream);
  saveData(data);

  closeDreamModal();
  showToast('梦想已创建！72小时内开始行动吧 ⏰', '🌟');
  renderDreams();

    return '<span class="emoji-option' + (e === dream.emoji ? ' selected' : '') + '" data-emoji="' + e + '">' + e + '</span>';
  }).join('');

  overlay.innerHTML =
    '<div class="modal-sheet" onclick="event.stopPropagation();">' +
    '<div class="modal-handle"></div>' +
    '<h3 style="font-size:18px;font-weight:700;margin-bottom:16px;color:var(--text);">✏️ 编辑梦想</h3>' +
    '<div class="dream-form">' +
    '<div class="form-group"><label class="form-label">梦想名称</label><input type="text" class="input" id="dream-name-input" value="' + escapeHtml(dream.name) + '" maxlength="30"></div>' +
    '<div class="form-group"><label class="form-label">目标金额</label><input type="number" class="input" id="dream-target-input" value="' + dream.target + '" min="0" step="0.01"></div>' +
    '<div class="form-group"><label class="form-label">目标日期</label><input type="date" class="input" id="dream-date-input" value="' + (dream.date || '') + '"></div>' +
    '<div class="form-group"><label class="form-label">选择图标</label><div class="emoji-picker" id="emoji-picker">' + emojiHtml + '</div><input type="hidden" id="dream-emoji-input" value="' + (dream.emoji || '🌟') + '"></div>' +
    '<div class="flex gap-8 mt-8"><button class="btn btn-outline btn-block" onclick="closeDreamModal()">取消</button><button class="btn btn-primary btn-block" onclick="submitEditDream(\'' + dreamId + '\')">💾 保存修改</button></div>' +
    '<button class="modal-delete-btn" onclick="closeDreamModal();deleteDream(\'' + dreamId + '\')">🗑️ 删除这个梦想</button>' +
    '</div>' +
    '</div>';

  document.body.appendChild(overlay);

  overlay.addEventListener('click', function(e) {
    if (e.target === overlay) {
      closeDreamModal();
    }
  });

  setTimeout(function() {
    var picker = document.getElementById('emoji-picker');
    if (picker) {
      var options = picker.querySelectorAll('.emoji-option');
      options.forEach(function(opt) {
        opt.addEventListener('click', function() {
          options.forEach(function(o) { o.classList.remove('selected'); });
          opt.classList.add('selected');
          document.getElementById('dream-emoji-input').value = opt.dataset.emoji;
        });
      });
    }
  }, 50);
}

function submitEditDream(dreamId) {
  var nameEl = document.getElementById('dream-name-input');
  var targetEl = document.getElementById('dream-target-input');
  var dateEl = document.getElementById('dream-date-input');
  var emojiEl = document.getElementById('dream-emoji-input');

  var name = (nameEl ? nameEl.value.trim() : '');
  var target = parseFloat(targetEl ? targetEl.value : 0);
  var date = dateEl ? dateEl.value : '';
  var emoji = emojiEl ? emojiEl.value : '🌟';

  if (!name) {
    showToast('请输入梦想名称', '⚠️');
    return;
  }
  if (!target || target <= 0) {
    showToast('请输入有效的目标金额', '⚠️');
    return;
  }

  var data = loadData();
  var dream = data.dreams.find(function(d) { return d.id === dreamId; });
  if (!dream) return;

  dream.name = name;
  dream.target = target;
  dream.date = date || null;
  dream.emoji = emoji;

  saveData(data);
  closeDreamModal();
  showToast('梦想已更新 ✨', '🌟');
  renderDreams();
}

function deleteDream(dreamId) {
  var data = loadData();
  var dream = data.dreams.find(function(d) { return d.id === dreamId; });
  if (!dream) return;

  if (!confirmDialog('确定要删除梦想"' + dream.name + '"吗？此操作不可恢复。')) {
    return;
  }

  data.dreams = data.dreams.filter(function(d) { return d.id !== dreamId; });
  saveData(data);
  showToast('梦想已删除', '🗑️');
  renderDreams();
}

function depositToDream(dreamId) {
  var data = loadData();
  var dream = data.dreams.find(function(d) { return d.id === dreamId; });
  if (!dream) return;

  var remaining = dream.target - dream.saved;
  if (remaining <= 0) {
    showToast('梦想目标已达成！🎉', '🌟');
    return;
  }

  var overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'dream-modal';

  overlay.innerHTML =
    '<div class="modal-sheet" onclick="event.stopPropagation();">' +
    '<div class="modal-handle"></div>' +
    '<h3 style="font-size:18px;font-weight:700;margin-bottom:16px;color:var(--text);">💰 存入梦想基金</h3>' +
    '<div class="deposit-form">' +
    '<div class="deposit-preview">' + (dream.emoji || '🌟') + '</div>' +
    '<div class="deposit-info"><strong>' + escapeHtml(dream.name) + '</strong><br>目标: ' + formatMoney(dream.target) + ' | 已存: ' + formatMoney(dream.saved) + '<br>还需: ' + formatMoney(remaining) + '</div>' +
    '<div class="form-group"><label class="form-label">存入金额</label><input type="number" class="input" id="deposit-amount-input" placeholder="' + formatMoney(remaining) + '" min="0.01" max="' + remaining + '" step="0.01" autofocus></div>' +
    '<div class="flex gap-8 mt-8"><button class="btn btn-outline btn-block" onclick="closeDreamModal()">取消</button><button class="btn btn-primary btn-block" onclick="submitDeposit(\'' + dreamId + '\')">💰 确认存入</button></div>' +
    '</div>' +
    '</div>';

  document.body.appendChild(overlay);

  overlay.addEventListener('click', function(e) {
    if (e.target === overlay) {
      closeDreamModal();
    }
  });

  setTimeout(function() {
    var input = document.getElementById('deposit-amount-input');
    if (input) input.focus();
  }, 100);
}

function submitDeposit(dreamId) {
  var input = document.getElementById('deposit-amount-input');
  var amount = parseFloat(input ? input.value : 0);

  if (!amount || amount <= 0) {
    showToast('请输入有效的存入金额', '⚠️');
    return;
  }

  var data = loadData();
  var dream = data.dreams.find(function(d) { return d.id === dreamId; });
  if (!dream) return;

  var remaining = dream.target - dream.saved;
  if (amount > remaining) {
    showToast('存入金额不能超过剩余目标 ' + formatMoney(remaining), '⚠️');
    return;
  }

  dream.saved += amount;

  saveData(data);
  closeDreamModal();

  confetti({ type: 'coin', count: 30, duration: 3000 });

  showToast('已存入 ' + formatMoney(amount) + '！离梦想更近一步 ✨', '💰');

  if (dream.saved >= dream.target) {
    setTimeout(function() {
      showToast('🎉 恭喜！"' + dream.name + '" 目标已达成！', '🌟');
      confetti({ count: 80, duration: 4000 });
    }, 1500);
  }

  renderDreams();
}

const FINANCE_QUICK_TASKS = [
  '📝 记录今天的成功日记',
  '💰 今天存了多少钱？',
  '🦆 喂鹅了吗？',
  '📖 阅读理财小知识',
  '📊 今日记账了吗？',
  '📈 本月支出复盘',
  '💰 收入到账划转储蓄',
  '🎯 检查本周财务目标',
];

const ENCOURAGE_MESSAGES = [
  '太棒了！🎉',
  '坚持就是胜利！💪',
  '又进一步！🌟',
  '你真了不起！👏',
  '今天也很努力呢！✨',
  '每一步都算数！🦶',
  '习惯正在养成！🌱',
];

function renderTasks() {
  const el = document.getElementById('page-tasks');
  const data = loadData();
  const tasks = data.tasks || [];

  let html = '';

  html += '<div class="card">';
  html += '<div class="card-header"><span class="icon">✅</span> 今日待办</div>';
  html += '<div class="input-group mb-8">';
  html += '<input type="text" class="input" id="task-input" placeholder="添加新的待办事项..." />';
  html += '<button class="btn btn-primary" onclick="addTask()">添加</button>';
  html += '</div>';

  html += '<div class="quick-tasks">';
  FINANCE_QUICK_TASKS.forEach(function(t) {
    html += '<button class="quick-task-btn" onclick="addQuickTask(\'' + escapeHtml(t) + '\')">' + t + '</button>';
  });
  html += '</div>';

  html += '<div id="task-list">';
  if (tasks.length === 0) {
    html += '<div class="empty-state">';
    html += '<div class="empty-icon">📋</div>';
    html += '<div class="empty-text">还没有待办事项哦~</div>';
    html += '<div class="empty-text" style="font-size:12px;margin-top:4px;">点击上方按钮快速添加理财小任务吧！</div>';
    html += '</div>';
  } else {
    tasks.forEach(function(task) {
      html += '<div class="task-item' + (task.done ? ' done' : '') + '" id="task-' + task.id + '">';
      html += '<input type="checkbox" class="task-checkbox" ' + (task.done ? 'checked' : '') + ' onclick="toggleTask(\'' + task.id + '\')" />';
      html += '<span class="task-text">' + escapeHtml(task.text) + '</span>';
      html += '<button class="task-delete" onclick="deleteTask(\'' + task.id + '\')" title="删除">✕</button>';
      html += '</div>';
    });
  }
  html += '</div>';
  html += '</div>';

  el.innerHTML = html;

  var input = document.getElementById('task-input');
  if (input) {
    input.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') addTask();
    });
    setTimeout(function() { input.focus(); }, 100);
  }
}

function addTask() {
  var input = document.getElementById('task-input');
  if (!input) return;
  var text = input.value.trim();
  if (!text) {
    showToast('请输入待办内容', '📝');
    return;
  }

  var data = loadData();
  if (!data.tasks) data.tasks = [];
  data.tasks.push({ id: generateId(), text: text, done: false, type: 'custom' });
  saveData(data);
  input.value = '';
  renderTasks();
  showToast('待办已添加', '✅');
}

function addQuickTask(text) {
  var data = loadData();
  if (!data.tasks) data.tasks = [];

  var exists = data.tasks.some(function(t) { return t.text === text; });
  if (exists) {
    showToast('该任务已存在', '💡');
    return;
  }

  data.tasks.push({ id: generateId(), text: text, done: false, type: 'finance' });
  saveData(data);
  renderTasks();
  showToast('任务已添加', '✅');
}

function toggleTask(id) {
  var data = loadData();
  var task = (data.tasks || []).find(function(t) { return t.id === id; });
  if (!task) return;

  task.done = !task.done;
  saveData(data);

  if (task.done) {
    confetti({ count: 30, type: 'confetti', duration: 2500 });
    var msg = ENCOURAGE_MESSAGES[Math.floor(Math.random() * ENCOURAGE_MESSAGES.length)];
    showToast(msg);
  }

  renderTasks();
}

function deleteTask(id) {
  if (!confirmDialog('确定删除这条待办吗？')) return;

  var data = loadData();
  data.tasks = (data.tasks || []).filter(function(t) { return t.id !== id; });
  saveData(data);
  renderTasks();
  showToast('待办已删除', '🗑️');
}

const GOOSE_LEVELS = [
  { min: 0, max: 999, emoji: '🥚', label: '蛋' },
  { min: 1000, max: 4999, emoji: '🐥', label: '小鸡' },
  { min: 5000, max: 9999, emoji: '🦆', label: '小鹅' },
  { min: 10000, max: 49999, emoji: '🦢', label: '大鹅' },
  { min: 50000, max: Infinity, emoji: '🦢', label: '金鹅', crown: true },
];

const ACCOUNT_CONFIG = [
  { key: 'goose', name: '鹅账户', icon: '🦆', desc: '纯投资，本金永不取出', colorVar: '--acct-goose', cssClass: 'acct-goose' },
  { key: 'dream', name: '梦想账户', icon: '🌟', desc: '买房、旅行、大件消费', colorVar: '--acct-dream', cssClass: 'acct-dream' },
  { key: 'edu', name: '教育账户', icon: '📚', desc: '学习提升赚钱能力', colorVar: '--acct-edu', cssClass: 'acct-edu' },
  { key: 'joy', name: '快乐账户', icon: '🎉', desc: '专门犒劳自己', colorVar: '--acct-joy', cssClass: 'acct-joy' },
  { key: 'daily', name: '日常账户', icon: '🛒', desc: '日常生活开销', colorVar: '--acct-daily', cssClass: 'acct-daily' },
];

function getGooseLevel(balance) {
  for (var i = GOOSE_LEVELS.length - 1; i >= 0; i--) {
    if (balance >= GOOSE_LEVELS[i].min) return GOOSE_LEVELS[i];
  }
  return GOOSE_LEVELS[0];
}

function renderGoose() {
  var el = document.getElementById('page-goose');
  var data = loadData();
  var accounts = data.accounts;
  var incomes = data.incomes || [];

  var gooseBalance = accounts.goose.balance;
  var level = getGooseLevel(gooseBalance);
  var gooseDisplay = level.emoji;
  if (level.crown) gooseDisplay += '<span class="goose-crown">👑</span>';

  // 计算总余额
  var totalBalance = accounts.goose.balance + accounts.dream.balance +
    accounts.edu.balance + accounts.joy.balance + accounts.daily.balance;

  var now = new Date();
  var thisMonth = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0');
  var monthIncomes = incomes.filter(function(inc) { return inc.date && inc.date.startsWith(thisMonth); });
  var totalMonthIncome = monthIncomes.reduce(function(sum, inc) { return sum + (inc.amount || 0); }, 0);

  var html = '';

  // 金鹅展示区
  html += '<div class="goose-display">';
  html += '<div style="position:relative;display:inline-block;">';
  html += '<span class="goose-emoji">' + gooseDisplay + '</span>';
  html += '</div>';
  html += '<div class="goose-level-tag">' + level.emoji + ' ' + level.label + '阶段</div>';
  html += '<div class="goose-balance">' + formatMoney(gooseBalance) + '</div>';
  html += '<div style="font-size:12px;color:var(--text-light);margin-top:2px;">总资产 ' + formatMoney(totalBalance) + '</div>';
  html += '</div>';

  // 操作栏
  html += '<div class="action-bar">';
  html += '<button class="btn btn-primary" onclick="openIncomeModal()">💰 录入收入</button>';
  html += '<button class="btn btn-outline" onclick="openRatioModal()">⚙️ 比例</button>';
  html += '</div>';

  // 5账户紧凑列表
  html += '<div class="account-list">';
  ACCOUNT_CONFIG.forEach(function(cfg) {
    var acct = accounts[cfg.key];
    html += '<div class="account-row">';
    html += '<div class="acct-color-bar" style="background:var(' + cfg.colorVar + ')"></div>';
    html += '<span class="acct-row-icon">' + cfg.icon + '</span>';
    html += '<div class="acct-row-info">';
    html += '<div class="acct-row-top">';
    html += '<span class="acct-row-name">' + cfg.name + '</span>';
    html += '<span class="acct-row-ratio">' + acct.ratio + '%</span>';
    html += '</div>';
    html += '<div class="acct-row-bottom">';
    html += '<span class="acct-row-balance">' + formatMoney(acct.balance) + '</span>';
    html += '<span class="acct-row-monthly">本月 +' + formatMoney(acct.monthlyIn) + '</span>';
    html += '</div>';
    html += '</div>';
    html += '</div>';
  });
  html += '</div>';

  // 可折叠：本月分配
  if (totalMonthIncome > 0) {
    html += '<div class="collapsible-card" id="alloc-card">';
    html += '<div class="collapsible-header" onclick="toggleCollapse(\'alloc-card\')">';
    html += '<div class="ch-icon"><span>📊</span> 本月收入分配</div>';
    html += '<span class="ch-arrow">▼</span>';
    html += '</div>';
    html += '<div class="collapsible-body"><div class="collapsible-body-inner">';
    html += '<div class="pie-chart">';
    ACCOUNT_CONFIG.forEach(function(cfg) {
      var acct = accounts[cfg.key];
      html += '<div class="pie-item">';
      html += '<div class="pie-color" style="background:var(' + cfg.colorVar + ')"></div>';
      html += '<span class="pie-label">' + cfg.icon + ' ' + cfg.name + '</span>';
      html += '<div class="pie-bar-track"><div class="pie-bar-fill" style="width:' + acct.ratio + '%;background:var(' + cfg.colorVar + ')"></div></div>';
      html += '<span class="pie-percent">' + acct.ratio + '%</span>';
      html += '</div>';
    });
    html += '</div>';
    html += '</div></div>';
    html += '</div>';
  }

  // 可折叠：收入历史
  html += '<div class="collapsible-card open" id="income-card">';
  html += '<div class="collapsible-header" onclick="toggleCollapse(\'income-card\')">';
  html += '<div class="ch-icon"><span>📋</span> 收入记录</div>';
  html += '<span class="ch-arrow">▼</span>';
  html += '</div>';
  html += '<div class="collapsible-body"><div class="collapsible-body-inner">';
  var recentIncomes = incomes.slice().reverse().slice(0, 10);
  if (recentIncomes.length === 0) {
    html += '<div class="empty-state" style="padding:24px 0;">';
    html += '<div class="empty-icon">💸</div>';
    html += '<div class="empty-text">还没有收入记录</div>';
    html += '<div class="empty-text" style="font-size:12px;margin-top:4px;">点击上方按钮录入第一笔收入</div>';
    html += '</div>';
  } else {
    html += '<div class="income-list">';
    recentIncomes.forEach(function(inc) {
      html += '<div class="income-item">';
      html += '<div class="income-item-left">';
      html += '<span class="income-amount">' + formatMoney(inc.amount) + '</span>';
      html += '<span class="income-source">' + escapeHtml(inc.source || '未分类') + '</span>';
      html += '</div>';
      html += '<div style="display:flex;align-items:center;gap:8px;">';
      html += '<span class="income-date">' + (inc.date || '') + '</span>';
      html += '<button class="income-delete" onclick="deleteIncome(\'' + inc.id + '\')" title="删除">✕</button>';
      html += '</div>';
      html += '</div>';
    });
    html += '</div>';
  }
  html += '</div></div>';
  html += '</div>';

  el.innerHTML = html;
}

function toggleCollapse(cardId) {
  var card = document.getElementById(cardId);
  if (card) {
    card.classList.toggle('open');
  }
}

function openIncomeModal() {
  var overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'income-modal';

  var today = getTodayStr();
  overlay.innerHTML = '<div class="modal-sheet">'
    + '<div class="modal-handle"></div>'
    + '<div class="modal-title">💰 录入收入</div>'
    + '<div class="modal-form-group"><label class="modal-form-label">收入金额</label>'
    + '<input type="number" class="input" id="income-amount" placeholder="请输入金额" step="0.01" min="0" /></div>'
    + '<div class="modal-form-group"><label class="modal-form-label">收入来源</label>'
    + '<input type="text" class="input" id="income-source" placeholder="如：工资、奖金、副业" /></div>'
    + '<div class="modal-form-group"><label class="modal-form-label">日期</label>'
    + '<input type="date" class="input" id="income-date" value="' + today + '" /></div>'
    + '<div class="allocation-preview" id="allocation-preview"></div>'
    + '<div class="modal-actions">'
    + '<button class="btn btn-outline btn-block" onclick="closeIncomeModal()">取消</button>'
    + '<button class="btn btn-primary btn-block" onclick="confirmIncome()">确认录入</button>'
    + '</div>'
    + '</div>';

  document.body.appendChild(overlay);

  overlay.addEventListener('click', function(e) {
    if (e.target === overlay) closeIncomeModal();
  });

  var amountInput = document.getElementById('income-amount');
  if (amountInput) {
    amountInput.addEventListener('input', updateAllocationPreview);
    setTimeout(function() { amountInput.focus(); }, 300);
  }

  updateAllocationPreview();
}

function closeIncomeModal() {
  var modal = document.getElementById('income-modal');
  if (modal) modal.remove();
}

function updateAllocationPreview() {
  var preview = document.getElementById('allocation-preview');
  if (!preview) return;

  var amountInput = document.getElementById('income-amount');
  var amount = parseFloat(amountInput ? amountInput.value : 0) || 0;
  var data = loadData();
  var accounts = data.accounts;

  var html = '<div style="font-size:13px;font-weight:600;margin-bottom:6px;">📊 分配建议（可手动调整）</div>';

  ACCOUNT_CONFIG.forEach(function(cfg) {
    var acct = accounts[cfg.key];
    var allocated = amount * acct.ratio / 100;
    html += '<div class="allocation-row">';
    html += '<span>' + cfg.icon + ' ' + cfg.name + ' (' + acct.ratio + '%)</span>';
    html += '<input type="number" class="allocation-amount-input" data-acct="' + cfg.key + '" value="' + allocated.toFixed(2) + '" step="0.01" min="0" />';
    html += '</div>';
  });

  preview.innerHTML = html;
}

function confirmIncome() {
  var amountEl = document.getElementById('income-amount');
  var sourceEl = document.getElementById('income-source');
  var dateEl = document.getElementById('income-date');

  var amount = parseFloat(amountEl ? amountEl.value : 0);
  var source = sourceEl ? sourceEl.value.trim() : '';
  var date = dateEl ? dateEl.value : getTodayStr();

  if (!amount || amount <= 0) {
    showToast('请输入有效的收入金额', '⚠️');
    return;
  }
  if (!source) {
    showToast('请输入收入来源', '⚠️');
    return;
  }

  var data = loadData();
  if (!data.incomes) data.incomes = [];

  data.incomes.push({ id: generateId(), amount: amount, source: source, date: date });

  var allocInputs = document.querySelectorAll('.allocation-amount-input');
  if (allocInputs.length > 0) {
    allocInputs.forEach(function(input) {
      var key = input.dataset.acct;
      var val = parseFloat(input.value) || 0;
      if (data.accounts[key]) {
        data.accounts[key].balance += val;
        data.accounts[key].monthlyIn += val;
      }
    });
  } else {
    ACCOUNT_CONFIG.forEach(function(cfg) {
      var acct = data.accounts[cfg.key];
      var allocated = amount * acct.ratio / 100;
      acct.balance += allocated;
      acct.monthlyIn += allocated;
    });
  }

  saveData(data);
  closeIncomeModal();
  renderGoose();
  confetti({ count: 40, type: 'coin', duration: 3000 });
  showToast('收入已录入，金鹅又长大了一点！', '💰');
}

function deleteIncome(id) {
  if (!confirmDialog('确定删除这条收入记录吗？')) return;

  var data = loadData();
  var income = (data.incomes || []).find(function(inc) { return inc.id === id; });
  if (!income) return;

  var amount = income.amount;
  ACCOUNT_CONFIG.forEach(function(cfg) {
    var acct = data.accounts[cfg.key];
    var allocated = amount * acct.ratio / 100;
    acct.balance = Math.max(0, acct.balance - allocated);
    acct.monthlyIn = Math.max(0, acct.monthlyIn - allocated);
  });

  data.incomes = data.incomes.filter(function(inc) { return inc.id !== id; });
  saveData(data);
  renderGoose();
  showToast('收入记录已删除', '🗑️');
}

function openRatioModal() {
  var data = loadData();
  var accounts = data.accounts;

  var overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'ratio-modal';

  var html = '<div class="modal-sheet">'
    + '<div class="modal-handle"></div>'
    + '<div class="modal-title">⚙️ 账户比例设置</div>'
    + '<div style="font-size:12px;color:var(--text-light);margin-bottom:12px;text-align:center;">调整5个账户的分配比例，总和需为100%</div>'
    + '<div class="ratio-settings">';

  ACCOUNT_CONFIG.forEach(function(cfg) {
    html += '<div class="ratio-row">';
    html += '<span class="ratio-label">' + cfg.icon + ' ' + cfg.name + '</span>';
    html += '<input type="number" class="ratio-input" data-acct="' + cfg.key + '" value="' + accounts[cfg.key].ratio + '" min="0" max="100" oninput="updateRatioTotal()" />';
    html += '<span style="font-size:12px;color:var(--text-light);">%</span>';
    html += '</div>';
  });

  html += '<div class="ratio-total" id="ratio-total">总计: 100%</div>';

  html += '<div class="modal-actions">'
    + '<button class="btn btn-outline btn-block" onclick="closeRatioModal()">取消</button>'
    + '<button class="btn btn-primary btn-block" onclick="confirmRatio()">保存设置</button>'
    + '</div>';

  html += '</div></div>';

  overlay.innerHTML = html;
  document.body.appendChild(overlay);

  overlay.addEventListener('click', function(e) {
    if (e.target === overlay) closeRatioModal();
  });

  updateRatioTotal();
}

function closeRatioModal() {
  var modal = document.getElementById('ratio-modal');
  if (modal) modal.remove();
}

function updateRatioTotal() {
  var total = 0;
  var inputs = document.querySelectorAll('#ratio-modal .ratio-input');
  inputs.forEach(function(input) {
    total += parseInt(input.value) || 0;
  });

  var totalEl = document.getElementById('ratio-total');
  if (totalEl) {
    totalEl.textContent = '总计: ' + total + '%';
    totalEl.className = 'ratio-total ' + (total === 100 ? 'valid' : 'invalid');
  }
}

function confirmRatio() {
  var total = 0;
  var ratios = {};

  var inputs = document.querySelectorAll('#ratio-modal .ratio-input');
  inputs.forEach(function(input) {
    var key = input.dataset.acct;
    var val = parseInt(input.value) || 0;
    ratios[key] = val;
    total += val;
  });

  if (total !== 100) {
    showToast('比例总和必须为100%，当前为' + total + '%', '⚠️');
    return;
  }

  var data = loadData();
  for (var key in ratios) {
    if (data.accounts[key]) {
      data.accounts[key].ratio = ratios[key];
    }
  }
  saveData(data);
  closeRatioModal();
  renderGoose();
  showToast('账户比例已更新', '✅');
}

// ============================================
// 模块2：成功日记
// ============================================

var diaryViewDate = getTodayStr();

function renderDiary() {
  var el = document.getElementById('sub-page-container') || document.getElementById('page-diary');
  renderDiaryInto(el);
}

function renderDiaryInto(el) {
  if (!el) el = document.getElementById('sub-page-container');
  var data = loadData();
  var diaries = data.diaries || {};
  var streak = data.streak || 0;
  var today = getTodayStr();

  var entries = diaries[diaryViewDate] || [];
  var isToday = diaryViewDate === today;
  var canGoNext = diaryViewDate < today;

  var html = '';

  html += '<div class="diary-header">';
  html += '<span class="streak-badge">🔥 连续 ' + streak + ' 天</span>';
  html += '</div>';

  html += '<div class="date-nav">';
  html += '<button class="date-nav-btn" onclick="changeDiaryDate(-1)">◀</button>';
  html += '<span class="date-nav-display">' + formatDate(diaryViewDate) + (isToday ? ' (今天)' : '') + '</span>';
  html += '<button class="date-nav-btn" onclick="changeDiaryDate(1)" ' + (!canGoNext ? 'disabled' : '') + '>▶</button>';
  html += '</div>';

  html += '<div class="card">';
  html += '<div class="card-header"><span class="icon">📝</span> ' + (isToday ? '今日成功记录' : '成功记录') + '</div>';

  if (!isToday && entries.length === 0) {
    html += '<div class="empty-state" style="padding:20px;">';
    html += '<div class="empty-icon">📖</div>';
    html += '<div class="empty-text">这一天还没有记录</div>';
    html += '</div>';
  } else {
    html += '<div class="diary-entry-count">已记录 ' + entries.length + '/5 条</div>';

    entries.forEach(function(entry, idx) {
      html += '<div class="diary-entry">';
      html += '<span class="diary-entry-number">' + (idx + 1) + '</span>';
      html += '<span class="diary-entry-text">' + escapeHtml(entry.text) + '</span>';
      if (isToday) {
        html += '<button class="diary-entry-delete" onclick="deleteDiaryEntry(\'' + entry.id + '\')" title="删除">✕</button>';
      }
      html += '</div>';
    });

    if (isToday && entries.length < 5) {
      html += '<div class="diary-add-row mt-8">';
      html += '<input type="text" class="input diary-add-input" id="diary-new-input" placeholder="今天完成了什么了不起的事？" />';
      html += '<button class="btn btn-primary btn-sm" onclick="addDiaryEntry()">记录</button>';
      html += '</div>';
    }

    if (isToday && entries.length > 0) {
      html += '<div class="mt-8 text-right">';
      html += '<button class="btn btn-outline btn-sm" onclick="saveDiaryToday()">💾 保存并庆祝</button>';
      html += '</div>';
    }
  }

  html += '</div>';

  html += '<div class="card">';
  html += '<div class="card-header"><span class="icon">📅</span> 最近7天</div>';
  html += '<div class="history-cards">';
  for (var i = 6; i >= 0; i--) {
    var d = new Date();
    d.setDate(d.getDate() - i);
    var dateStr = d.toISOString().split('T')[0];
    var dayEntries = diaries[dateStr] || [];
    var isSelected = dateStr === diaryViewDate;

    html += '<div class="history-card' + (isSelected ? ' selected' : '') + '" onclick="viewDiaryDate(\'' + dateStr + '\')">';
    html += '<div class="history-card-date">' + (d.getMonth() + 1) + '/' + d.getDate() + '</div>';
    html += '<div class="history-card-count">' + dayEntries.length + '</div>';
    html += '<div style="font-size:10px;color:var(--text-light);">条</div>';
    html += '</div>';
  }
  html += '</div>';
  html += '</div>';

  el.innerHTML = html;

  var input = document.getElementById('diary-new-input');
  if (input) {
    input.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') addDiaryEntry();
    });
    setTimeout(function() { input.focus(); }, 100);
  }
}

function changeDiaryDate(delta) {
  var d = new Date(diaryViewDate);
  d.setDate(d.getDate() + delta);

  var newDate = d.toISOString().split('T')[0];
  var today = getTodayStr();

  if (newDate > today) return;

  diaryViewDate = newDate;
  renderDiary();
}

function viewDiaryDate(dateStr) {
  diaryViewDate = dateStr;
  renderDiary();
}

function addDiaryEntry() {
  var input = document.getElementById('diary-new-input');
  if (!input) return;
  var text = input.value.trim();
  if (!text) {
    showToast('请输入成功记录', '📝');
    return;
  }

  var data = loadData();
  var today = getTodayStr();
  if (!data.diaries) data.diaries = {};
  if (!data.diaries[today]) data.diaries[today] = [];

  if (data.diaries[today].length >= 5) {
    showToast('每天最多记录5条哦', '💡');
    return;
  }

  data.diaries[today].push({ id: generateId(), text: text });
  saveData(data);
  input.value = '';

  diaryViewDate = today;
  renderDiary();

  var newInput = document.getElementById('diary-new-input');
  if (newInput) newInput.focus();

  showToast('已记录 ' + data.diaries[today].length + '/5 条', '✍️');
}

function deleteDiaryEntry(id) {
  if (!confirmDialog('确定删除这条记录吗？')) return;

  var data = loadData();
  var today = getTodayStr();
  if (data.diaries && data.diaries[today]) {
    data.diaries[today] = data.diaries[today].filter(function(e) { return e.id !== id; });
    saveData(data);
    renderDiary();
    showToast('记录已删除', '🗑️');
  }
}

function saveDiaryToday() {
  var data = loadData();
  var today = getTodayStr();
  var entries = (data.diaries && data.diaries[today]) ? data.diaries[today] : [];

  if (entries.length === 0) {
    showToast('今天还没有记录呢', '📖');
    return;
  }

  if (data.lastDiaryDate) {
    var lastDate = new Date(data.lastDiaryDate);
    var curDate = new Date(today);
    var diffDays = Math.floor((curDate - lastDate) / (1000 * 60 * 60 * 24));

    if (diffDays === 1) {
      data.streak = (data.streak || 0) + 1;
    } else if (diffDays > 1) {
      data.streak = 1;
    }
  } else {
    data.streak = 1;
  }

  data.lastDiaryDate = today;
  saveData(data);

  confetti({ count: 50, type: 'confetti', duration: 3500 });
  showToast('成功日记已保存！连续 ' + data.streak + ' 天 🔥');

  renderDiary();
}

function addEmergencyFund() {
  const amount = parseFloat(document.getElementById('ef-amount').value);
  if (!amount || amount <= 0) {
    showToast('请输入有效金额', '⚠️');
    return;
  }
  const data = loadData();
  const wasComplete = data.freedom.phase1Complete;
  data.freedom.emergencyFund += amount;

  if (data.freedom.monthlyEssential > 0 && data.freedom.emergencyFund >= data.freedom.monthlyEssential * 6) {
    data.freedom.phase1Complete = true;
    if (!wasComplete) {
      closeModal();
      showToast('🎉 财务保障阶段完成！', '🛡️');
      confetti({ count: 50, type: 'coin', duration: 3000 });
      saveData(data);
      renderFreedom();
      return;
    }
  }

  saveData(data);
  closeModal();
  showToast(`已存入 ${formatMoney(amount)}`, '💰');
  renderFreedom();
}

function addInvestmentPrincipal() {
  const amount = parseFloat(document.getElementById('inv-amount').value);
  if (!amount || amount <= 0) {
    showToast('请输入有效金额', '⚠️');
    return;
  }
  const data = loadData();
  const wasComplete = data.freedom.phase2Complete;
  data.freedom.investmentPrincipal += amount;

  if (data.freedom.monthlyEssential > 0 && data.freedom.investmentPrincipal >= data.freedom.monthlyEssential * 150) {
    data.freedom.phase2Complete = true;
    if (!wasComplete) {
      closeModal();
      showToast('🎉 财务安全阶段完成！', '🔒');
      confetti({ count: 60, type: 'confetti', duration: 3000 });
      saveData(data);
      renderFreedom();
      return;
    }
  }

  saveData(data);
  closeModal();
  showToast(`已记录 ${formatMoney(amount)}`, '📈');
  renderFreedom();
}
